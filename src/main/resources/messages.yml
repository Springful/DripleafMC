# ═════════════════════════════════════════════════════════════════════
#   DripleafCore — messages.yml
#
#   Every player-facing string in the plugin lives here. There are no
#   string literals in the Java. Retheming the plugin is editing this
#   file and running /dripleafcore reload messages.
#
#   Format is MiniMessage: https://docs.advntr.dev/minimessage/format
#   Placeholders are written <like_this> and are substituted safely —
#   a player whose name contains a < cannot inject formatting.
#
#   THE HOUSE PALETTE ─────────────────────────────────────────────────
#     brand gradient   #dce35b → #45b649
#     soul gradient    #AA00FF → #FF55FF
#     shard gradient   #00CFFF → #7FE9FF
#     success          #55FF55        failure     #FF5555
#     danger           #FF3333        deep danger #800000
#     body             #DDDDDD        muted       #AAAAAA
#     structure        #555555        parenthetical #333333
#     warning          #FFAA00
#
#   THE GLYPH SET ─────────────────────────────────────────────────────
#     ■ section header      ➥ line item        ✓ met        ✗ unmet
#     ✦ soul/ascension      ↪ call to action   ⚠ warning    ┃ separator
#     ▰▱ progress bar
# ═════════════════════════════════════════════════════════════════════

prefix: "<gradient:#dce35b:#45b649><bold>Dripleaf</bold></gradient> <#555555>»</#555555> "


