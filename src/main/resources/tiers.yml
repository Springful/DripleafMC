# =====================================================================
#  DripleafRebirth  -  tiers.yml
# ---------------------------------------------------------------------
#  ONE FILE, ONE JOB: this file defines WHAT EACH TIER COSTS and WHAT
#  IT PAYS OUT. Nothing else. The three blocks per tier are always:
#
#     cost:          <- money burned to ascend (per path)
#     requirements:  <- gates that must be satisfied to ascend
#     rewards:       <- values + reward-sets fired on success
#
#  The actual COMMANDS are never written here. They live in
#  rewards.yml as named reward-sets, and tiers just reference them.
#  That keeps "how much" separate from "what runs".
#
#  Placeholders usable in reward-sets, resolved per-tier:
#     <tier> <tier_roman> <path> <player> <uuid>
#     <cash> <keys> <multiplier> <souls>   (from rewards.values below)
#     ...plus any custom key you add under values:
#
#  Requirement types:
#     STATISTIC        statistic: MINE_BLOCK   material: STONE
#                      statistic: KILL_ENTITY  entity: ZOMBIE
#                      statistic: FISH_CAUGHT  (no qualifier)
#     MCMMO_POWER      power level (native mcMMO API, no PAPI parse)
#     PLAYTIME         amount is in HOURS
#     PLACEHOLDER      placeholder: "%some_papi_placeholder%"
#     PERMISSION       permission: "some.node"   (pass/fail gate)
#     LEVEL            vanilla XP levels
# =====================================================================

# Applied to every tier unless the tier overrides it.
defaults:
  cost-multipliers:
    standard: 1.0
    soul: 2.0
  reward-sets:
    standard: [ core, standard ]
    soul: [ core, standard, soul ]

