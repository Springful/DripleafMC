# ═════════════════════════════════════════════════════════════════════
#   DripleafCore — SERVER SHOP
#   Currency: money (Vault)
#
#   Staff: to add an item, copy any block under `items:` and edit it.
#   The key (e.g. `diamond`) must be unique within this file. Reload with
#   /dripleafcore reload shops.
#
#   All three shop files share this schema and are parsed by the same
#   code, so anything you learn here applies to the shard and soul shops
#   too. Adding a fourth shop is a config file, not a code change.
#
#   The engine will refuse to start an item silently:
#     • no buy and no sell  → logged by key and skipped
#     • sell above buy      → loud startup warning (it is a money printer)
#     • unknown category    → moved to an auto-made "Uncategorised"
#     • unknown material    → logged by key and skipped
# ═════════════════════════════════════════════════════════════════════

settings:
  title: "<gradient:#dce35b:#45b649>Server Shop</gradient>"
  currency: money             # money | shards | souls
  show-balance: true
  search-enabled: true
  quick-buy-enabled: true
  # How many personal shortcut slots each player gets in this shop.
  quick-buy-slots: 14
  # Whether a shortcut purchase still shows a confirmation. On by
  # default: spending money on one click is exactly the thing players
  # report as a bug.
  quick-buy-confirm: true
  # Multiplies every sell price. Rebirth multipliers stack on top of it.
  global-sell-multiplier: 1.0
  # Required to open the shop at all. Blank = everyone.
  permission: ""

