# ═════════════════════════════════════════════════════════════════════
#   DripleafCore — core/commands.yml
#
#   Every core command is individually toggleable, and a disabled command
#   is NEVER REGISTERED AT ALL. That is the point: it cannot collide with
#   EssentialsX, or with anything else, because as far as the server is
#   concerned it does not exist.
#
#   Almost everything here therefore ships DISABLED. Turn commands on one
#   at a time, after disabling the Essentials equivalent, and reload with
#   /dripleafcore reload core.
#
#   Per command:
#     enabled      register it at all
#     permission   node required to run it
#     aliases      alternative names
#     cooldown     seconds after a SUCCESSFUL run (0 = none)
#     warmup       seconds before it executes  (0 = none)
#     description  shown in tab completion and on the admin screen
#
#   Bypasses:  dripleaf.bypass.cooldown[.<id>]
#              dripleaf.bypass.warmup[.<id>]
# ═════════════════════════════════════════════════════════════════════

