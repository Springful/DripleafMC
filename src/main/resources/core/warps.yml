# ═════════════════════════════════════════════════════════════════════
#   DripleafCore — core/warps.yml
#
#   The warp menu is grouped by `category` and paginated. Warps a player
#   cannot use are shown GREYED WITH THE REASON rather than hidden —
#   a visible goal drives progression, an empty grid does not.
#
#   /setwarp <name> [category] writes an entry here at your position.
#   Everything else is hand-edited; reload with /dripleafcore reload core.
#
#   Per warp:
#     display      MiniMessage name shown in the menu
#     icon         any Material
#     description  lore lines
#     location     world/x/y/z/yaw/pitch — the world must be loaded
#     permission   blank = everyone
#     cost         money; supports k/m/b/t
#     warmup       seconds before travelling (cancels on movement)
#     cooldown     seconds before this warp can be used again
#     category     groups warps in the menu
#     slot         fixed chest-GUI slot; omit or -1 to auto-arrange
# ═════════════════════════════════════════════════════════════════════

warps: {}

