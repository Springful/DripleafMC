    sprite: "minecraft:block/crimson_stem"
  WARPED_STEM:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/warped_stem"

  # ── Blocks whose item form has its own sprite ─────────────────────
  # Doors, beds, signs and banners are drawn from the ITEM atlas: their
  # block models are multi-part and have no single representative face.
  OAK_DOOR:
    atlas: "minecraft:items"
    sprite: "minecraft:item/oak_door"
  IRON_DOOR:
    atlas: "minecraft:items"
    sprite: "minecraft:item/iron_door"
  RED_BED:
    atlas: "minecraft:items"
    sprite: "minecraft:item/red_bed"
  OAK_SIGN:
    atlas: "minecraft:items"
    sprite: "minecraft:item/oak_sign"
  CHEST:
    atlas: "minecraft:items"
    sprite: "minecraft:item/chest"
  ENDER_CHEST:
    atlas: "minecraft:items"
    sprite: "minecraft:item/ender_chest"
  TRAPPED_CHEST:
    atlas: "minecraft:items"
    sprite: "minecraft:item/trapped_chest"
  CAKE:
    atlas: "minecraft:items"
    sprite: "minecraft:item/cake"
  SUSPICIOUS_SAND:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/suspicious_sand_0"
  SUSPICIOUS_GRAVEL:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/suspicious_gravel_0"


# Shown when a material cannot be resolved at all. Anything is better
# than a checkerboard, and a barrier reads unambiguously as "missing".
fallback:
  atlas: "minecraft:items"
  sprite: "minecraft:item/barrier"
