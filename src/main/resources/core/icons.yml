# ═════════════════════════════════════════════════════════════════════
#   DripleafCore — core/icons.yml
#
#   THE PROBLEM THIS FILE SOLVES
#   Minecraft draws menu icons from sprite atlases. Item textures live in
#   minecraft:items; block textures live in minecraft:blocks. Ask the
#   wrong atlas for a sprite and the client renders the pink-and-black
#   missing-texture checkerboard — which is exactly what happened when
#   every item in the Server Shop was resolved against the block atlas
#   while every block rendered fine.
#
#   The plugin now picks the atlas by whether a material is a block, and
#   this file is the escape hatch for the cases where the sprite name
#   does not match the material name.
#
#   WHEN YOU SEE A CHECKERBOARD, ADD A LINE HERE. No rebuild needed —
#   /dripleafcore reload picks it up.
#
#     MATERIAL_NAME:
#       atlas:  "minecraft:blocks"   # or minecraft:items
#       sprite: "minecraft:block/…"  # or minecraft:item/…
#
#   Tip: F3+S in game dumps the current atlas contents, which is the only
#   authoritative list of sprite names for the version you are running.
#   Trust that over any documentation, including this comment.
# ═════════════════════════════════════════════════════════════════════

overrides:

  # ── Multi-face blocks ─────────────────────────────────────────────
  # These have _top / _side / _bottom textures and no plain one.
  GRASS_BLOCK:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/grass_block_side"
  PODZOL:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/podzol_side"
  MYCELIUM:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/mycelium_side"
  CRAFTING_TABLE:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/crafting_table_front"
  FURNACE:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/furnace_front"
  BLAST_FURNACE:
