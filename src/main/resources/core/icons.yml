  # ── Logs and stems ────────────────────────────────────────────────
  OAK_LOG:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/oak_log"
  SPRUCE_LOG:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/spruce_log"
  BIRCH_LOG:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/birch_log"
  JUNGLE_LOG:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/jungle_log"
  ACACIA_LOG:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/acacia_log"
  DARK_OAK_LOG:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/dark_oak_log"
