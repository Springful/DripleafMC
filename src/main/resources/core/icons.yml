  LOOM:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/loom_front"
  BARREL:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/barrel_side"
  CARTOGRAPHY_TABLE:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/cartography_table_side1"
  SMITHING_TABLE:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/smithing_table_front"
  OBSERVER:
    atlas: "minecraft:blocks"
    sprite: "minecraft:block/observer_front"
