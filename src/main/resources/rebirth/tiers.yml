# ══════════════════════════════════════════════════════════════════════
#   DripleafCore — rebirth/tiers.yml
#
#   TO ADD A NEW TIER: copy the last block, increment the number, and
#   edit it. Nothing else needs changing anywhere — no code, no other
#   file. Then run /dripleafcore reload rebirth.
#
#   Tiers must be consecutive starting at 1. A gap is reported at load
#   because a gap means a player can reach a tier they can never leave.
#
#   Per tier:
#     numeral                shown in menus; any text
#     cost                   money cost of the Standard path (k/m/b/t ok)
#     soul-cost-multiplier   Soul Ascension costs cost × this
#     icon                   optional; defaults to the requirement material
#     requirements           everything that must be true first
#     rewards.cash           starting money injected after the wipe
#     rewards.keys           crate keys
#     rewards.multiplier     +% sell and jobs money
#     rewards.souls          soul tokens — SOUL PATH ONLY
#     unlocks                display-only; the grants live in unlocks.yml
#     commands               console commands run at completion
#     soul-commands          extra console commands, soul path only
#
#   Substitutions available in commands:
#     <player> <tier> <numeral> <keys> <cash> <souls> <multiplier> <cost>
#
#   Requirement types:
#     mcmmo-power: <n>
#     playtime: <hours>
#     permission: "<node>"
#     stat:
#       type: <Bukkit Statistic>     e.g. MINE_BLOCK, KILL_ENTITY, FISH_CAUGHT
#       material: <Material>         for BLOCK/ITEM statistics
#       entity: <EntityType>         for ENTITY statistics
#       amount: <n>
#       display: "<what players see>"
# ══════════════════════════════════════════════════════════════════════

