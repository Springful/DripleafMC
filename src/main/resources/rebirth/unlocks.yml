# ══════════════════════════════════════════════════════════════════════
#   DripleafCore — rebirth/unlocks.yml
#
#   Each unlock carries BOTH the string players are shown AND the command
#   that actually grants it. That pairing is the point of this file: in
#   the Skript version the executing script and the info menu were two
#   separate lists, and they drifted — the script granted bonus keys at
#   tiers 5, 10, 15 and 20 that the info menu never mentioned. Here they
#   cannot drift, because they are the same entry.
#
#   These commands run on the console when the tier is reached, after the
#   tier's own `commands:` block in tiers.yml. <player> is substituted.
#
#   ⚠ THE CHEST SHOP, AUCTION AND PLAYER WARP NODES BELOW ARE PLACEHOLDERS.
#   The plugins that own those limits have not been confirmed, so the
#   nodes are named plausibly rather than correctly. Replace them with the
#   real ones before going live — see docs/REBIRTH.md.
#
#   ⚠ /disposal is listed at tier 10, which is what the executing Skript
#   did. The old info menu said tier 17. Tier 10 is the working default;
#   it is a real design decision and needs confirming.
# ══════════════════════════════════════════════════════════════════════

unlocks:

  1:
    - display: "Unlock: /recipe command"
      commands:
        - "lp user <player> permission set dripleaf.recipe true"
    - display: "Unlock: +5 chest shops (15 total)"
